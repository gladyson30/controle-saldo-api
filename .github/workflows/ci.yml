name: CI API

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: controle_saldo_test
          POSTGRES_USER: controle
          POSTGRES_PASSWORD: controle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controle -d controle_saldo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/controle_saldo_test
      SPRING_DATASOURCE_USERNAME: controle
      SPRING_DATASOURCE_PASSWORD: controle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build e testes (unitários e integração)
        run: ./mvnw -B verify -DskipITs=false